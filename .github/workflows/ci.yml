name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch makes the previous run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      # The e2e job builds too, but a broken build shows up there as a web
      # server timeout. Here it fails with the actual compiler error. The
      # shadcn CSS import that broke only the production build is exactly
      # this class of problem: invisible to tsc.
      - run: pnpm build

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    # Separate from `checks` so the fast feedback does not wait behind the
    # browser download, and so both run in parallel.
    env:
      # A Neon branch of its own, not the database behind the deployment. The
      # specs sign up real accounts, and those should not pile up next to the
      # demo data. The direct connection is used rather than the pooled one,
      # because migrations are DDL in a transaction and the pooler works in
      # transaction mode.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Brings the branch to the schema the code expects, which also exercises
      # the migrations on every run. drizzle-kit is called directly here:
      # the db:migrate script goes through dotenv-cli for .env.local, which
      # does not exist on CI.
      - name: Apply migrations
        run: pnpm exec drizzle-kit migrate

      # CI is set by GitHub, which makes playwright.config.ts build the app and
      # test against `next start` instead of the dev server.
      - run: pnpm test:e2e

      - name: Upload the report when something failed
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
